name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      # No docker-level health checks: the qdrant image is minimal (no curl/wget),
      # so readiness is probed from the runner instead (see "Wait for services").
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        env:
          NEO4J_AUTH: "neo4j/changeit"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Wait for services
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:6333/readyz && curl -sf http://localhost:7474/; then
              echo "Qdrant and Neo4j are ready" && exit 0
            fi
            sleep 5
          done
          echo "::error::Qdrant/Neo4j did not become ready within 5 minutes" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test # unit + integration (services up; no real API keys needed)
      - run: bun run build
