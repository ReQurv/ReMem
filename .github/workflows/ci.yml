name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2
        ports:
          - 6333:6333
        options: >-
          --health-cmd="curl -sf http://localhost:6333/readyz || exit 1"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20
      neo4j:
        image: neo4j:5
        ports:
          - 7687:7687
          - 7474:7474
        environment:
          NEO4J_AUTH: "neo4j/changeit"
        options: >-
          --health-cmd="wget -qO- http://localhost:7474 || exit 1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test # unit + integration (services up; no real API keys needed)
      - run: bun run build
