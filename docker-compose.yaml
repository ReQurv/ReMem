# ReMem — single-command stack: Qdrant + Neo4j + the remem-mcp HTTP server.
#
#   cp .env.example .env     # fill OPENAI_API_KEY; edit MCP_USERS for >1 user
#   docker compose up -d
#
# Agents point at http://localhost:3100/mcp (Authorization: Bearer <key>).
# Data persists in named volumes. See .env.example.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: remem-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: remem-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeit}"
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  remem-mcp:
    build: .
    container_name: remem-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${PORT:-3100}:3100"
    environment:
      PORT: "3100"
      # Internal service names (not localhost): the server runs in this network.
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeit}
      # LLM: OpenAI-compatible (default) or local Ollama (see .env.example).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hive.requrv.ai/api/v1}
      EMBEDDER_PROVIDER: ${EMBEDDER_PROVIDER:-}
      CHAT_PROVIDER: ${CHAT_PROVIDER:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://localhost:11434}
      # Principals: JSON array of {key, name, tenant, company, role} — one per
      # user. The default works out of the box (one local user, admin).
      MCP_USERS: ${MCP_USERS:-[{"key":"rk-local","name":"local","tenant":"personal","company":"shared","role":"admin"}]}
    # Lets the container reach host services (e.g. Ollama on the host).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_storage:
  neo4j_data:
