# ReMem — enterprise self-hosting stack.
#
#   docker compose -f deploy/compose.yaml up -d
#
# Qdrant + Neo4j + the multi-tenant MCP HTTP server, in one command.
# Everything persists in named volumes. See deploy/.env.example.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    container_name: remem-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    container_name: remem-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-changeit}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  remem-mcp:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: remem-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${PORT:-3100}:3100"
    environment:
      PORT: "3100"
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-changeit}
      # LLM: OpenAI-compatible (default) or local Ollama (add an ollama service).
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://hive.requrv.ai/api/v1}
      # Required: JSON array of principals (API key → personal + company tenant).
      MCP_USERS: ${MCP_USERS:-}
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3100/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  qdrant_storage:
  neo4j_data:
